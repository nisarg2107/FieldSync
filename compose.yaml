services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fieldsync
      POSTGRES_PASSWORD: fieldsync
      POSTGRES_DB: fieldsync
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldsync"]
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://fieldsync:fieldsync@db:5432/fieldsync?sslmode=disable
      JWT_SECRET: fieldsync-local-learning-secret-change-for-shared-hosting
      MEDIA_DIR: /data/media
    volumes:
      - media:/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  media:

